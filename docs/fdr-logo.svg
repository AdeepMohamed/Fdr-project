<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none">
  <defs>
    <linearGradient id="gradPrimary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="50%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded hexagon / shield container -->
  <rect x="6" y="6" width="108" height="108" rx="28" fill="url(#shieldGrad)" stroke="url(#gradPrimary)" stroke-width="2.5" />
  
  <!-- Outer glowing accent ring -->
  <circle cx="60" cy="60" r="42" stroke="url(#gradPrimary)" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.4" />

  <!-- Vault / Certificate Shield Symbol -->
  <path d="M60 26 L86 37 V58 C86 75 74 90 60 96 C46 90 34 75 34 58 V37 L60 26 Z" fill="url(#gradPrimary)" opacity="0.15" />
  <path d="M60 26 L86 37 V58 C86 75 74 90 60 96 C46 90 34 75 34 58 V37 L60 26 Z" stroke="url(#gradPrimary)" stroke-width="2.5" stroke-linejoin="round" />

  <!-- Inner Bank / Security Deposit Pillars -->
  <path d="M46 52 V72 M55 50 V74 M65 50 V74 M74 52 V72" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" />
  
  <!-- Pediment (Roof) -->
  <path d="M42 46 L60 36 L78 46" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  <line x1="40" y1="48" x2="80" y2="48" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" />
  
  <!-- Foundation (Base) -->
  <rect x="41" y="75" width="38" height="4" rx="1.5" fill="#38BDF8" />
  <circle cx="60" cy="43" r="2.5" fill="#38BDF8" />

  <!-- Verification Checkmark / Badge -->
  <circle cx="82" cy="78" r="13" fill="#10B981" stroke="#0F172A" stroke-width="2.5" />
  <path d="M77 78 L80.5 81.5 L87.5 74.5" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
</svg>
